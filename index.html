<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scutum Logistic ERP</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/theme.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <div id="auth-screen" class="spa-view active" style="display: flex;">
        <div class="login-card">
            <h1 style="color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 5px;">SCUTUM ERP</h1>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 24px;">LOGISTIC ECOSYSTEM V20</p>
            
            <div id="matryoshka-container"></div>
            <select id="login-profile" style="display: none;"></select>

            <div class="input-group" style="margin-top: 15px;">
                <label>Codice PIN Operativo</label>
                <input type="password" id="login-password" pattern="[0-9]*" inputmode="numeric" placeholder="Inserisci PIN">
            </div>

            <div id="login-lockout-msg" style="display: none; color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; font-weight: 700; text-align: center;">
                <i class="fa-solid fa-triangle-exclamation"></i> TERMINALE BLOCCATO. Riprova tra <span id="lockout-timer">60</span>s
            </div>

            <button id="btn-login" class="btn-action solid" style="background: var(--accent); color: #000; font-weight: 800; padding: 14px;" onclick="window.performLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> ACCEDI AL TERMINALE
            </button>
        </div>
    </div>

    <div id="app-wrapper" class="spa-view" style="display: none;">
        
        <aside id="main-sidebar">
            <div style="padding: 20px; border-bottom: 1px solid var(--border);">
                <div id="current-user-label" style="font-weight: 900; font-size: 0.9rem; color: var(--accent);">OPERATORE</div>
            </div>
            <div style="padding: 20px; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); letter-spacing: 1px;">SEDI RETE</div>
            <div id="sedi-menu"></div>
            <div style="padding: 20px; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); letter-spacing: 1px;">FILTRI CELLA</div>
            <div id="categories-filter-menu"></div>
        </aside>

        <main id="main-layout">
            <header id="main-header">
                <button class="btn-action" id="menu-toggle-btn" style="width: auto; padding: 8px 12px;" onclick="document.getElementById('main-sidebar').classList.toggle('open')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 id="header-title" style="margin: 0; font-weight: 800; font-size: 1.2rem;">SCUTUM LOGISTIC</h2>
                <button class="btn-action" style="width: auto; padding: 8px 12px; border-color: var(--nexus); color: var(--nexus);" onclick="window.switchSpaView('nexus-view'); window.hf_renderNexusHub();">
                    <i class="fa-solid fa-hubspot"></i> NEXUS HUB
                </button>
            </header>

            <div id="folders-menu"></div>
            <div id="spoke-checklists-container" style="display: flex; gap: 12px; padding: 0 20px 16px 20px;"></div>
            <div id="main-content"></div>
        </main>
        
        <button id="floating-paste-btn" style="display:none; position:fixed; bottom:24px; right:24px; width:60px; height:60px; border-radius:50%; background:var(--accent); color:#000; font-size:1.5rem; border:none; box-shadow:0 4px 15px rgba(201,164,100,0.4); z-index:100; justify-content:center; align-items:center;" onclick="window.hf_pasteSection()"><i class="fa-solid fa-paste"></i></button>
    </div>

    <div id="nexus-view" class="spa-view" style="display: none; padding: 20px; max-width: 800px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h2 style="font-weight: 900; color: var(--nexus); margin: 0;"><i class="fa-solid fa-circle-nodes"></i> MATRICE LOGISTICA CENTRALE</h2>
            <button class="btn-action" style="width: auto; padding: 8px 16px;" onclick="window.switchSpaView('app-wrapper'); window.renderApp();">
                <i class="fa-solid fa-arrow-left"></i> TORNA ALLA RETE
            </button>
        </div>
        <div id="nexus-content"></div>
        <div id="nexus-actions-container" style="display: flex; gap: 16px; margin-top: 24px;"></div>
    </div>

    <div id="modal-layer" class="modal-overlay" style="display: none;"></div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
