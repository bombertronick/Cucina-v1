<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0D0907">
    
    <title>Scutum ERP V15.8 Absolute</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <div id="toast-container"></div>

    <div id="app-root">
        <div id="auth-screen" class="spa-view active" style="display: flex; justify-content: center; align-items: center; padding: 24px; pointer-events: auto !important;">
            <div class="card" style="width: 100%; max-width: 400px; padding: 32px; text-align: center; border: 1px solid var(--accent);">
                <i class="fa-solid fa-shield-halved" style="font-size: 4rem; color: var(--accent); margin-bottom: 24px;"></i>
                <h2 style="color: var(--accent); margin-bottom: 8px; letter-spacing: 2px;">SCUTUM ERP</h2>
                <p id="boot-status" style="color: var(--text-muted); margin-bottom: 32px; font-weight: 700;">INIZIALIZZAZIONE MOTORE...</p>
                
                <div id="login-profile-container" style="display: none; margin-bottom: 16px;">
                    <select id="login-profile" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: var(--accent); font-weight: 800; font-size: 1.1rem; text-align: center; outline: none;">
                        <option value="admin">ROOT (AMMINISTRATORE)</option>
                    </select>
                </div>

                <div class="input-group">
                    <input type="number" pattern="[0-9]*" inputmode="numeric" id="login-password" placeholder="PIN DI ACCESSO" 
                           style="text-align: center; letter-spacing: 8px; font-size: 1.5rem; width: 100%;">
                </div>
                
                <button class="btn-action solid" onclick="if(window.performLogin) { window.performLogin(); } else { alert('Il motore JavaScript non è ancora avviato o è in crash.'); }" style="margin-top: 24px; width: 100%;">
                    <i class="fa-solid fa-fingerprint"></i> ACCEDI
                </button>
            </div>
        </div>
        
        <div id="checklist-hub" class="spa-view" style="display: none; padding: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <h1 style="font-weight: 800; font-size: 1.5rem;">LINEA DI SPUNTA</h1>
                <button class="btn-action" style="width:auto; padding:12px;" onclick="window.logout();"><i class="fa-solid fa-power-off"></i></button>
            </div>
            <div id="checklist-content"></div>
        </div>
        
        <div id="app-wrapper" class="spa-view" style="display: none; flex-direction: row;">
            <aside class="sidebar" id="main-sidebar">
                <div class="sidebar-logo">
                    <i class="fa-solid fa-shield-halved"></i> SCUTUM
                    <i class="fa-solid fa-xmark" id="sidebar-close" style="display:none; margin-left:auto; cursor:pointer;" onclick="document.getElementById('main-sidebar').classList.remove('open')"></i>
                </div>
                
                <div style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px;">RETI LOGISTICHE</div>
                <div id="sedi-menu" style="margin-bottom: 24px;"></div>
                
                <div style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px;">FILTRI MATRICE</div>
                <div id="categories-filter-menu"></div>
                
                <div class="nav-item nexus" onclick="window.switchSpaView('nexus-hub'); window.renderNexusHub?.();">
                    <i class="fa-solid fa-fire-burner"></i> HUB NEXUS
                </div>

                <div class="sidebar-footer" style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border);">
                    <div style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px;">OPERATORE ATTIVO</div>
                    <div id="current-user-label" style="font-weight: 800; color: var(--accent); font-size: 1.1rem;">---</div>
                    <button class="btn-action" style="padding: 10px; margin-top: 12px;" onclick="window.logout();">
                        <i class="fa-solid fa-right-from-bracket"></i> Disconnetti
                    </button>
                </div>
            </aside>

            <main id="main-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <i class="fa-solid fa-bars" style="font-size: 1.5rem; cursor: pointer;" onclick="document.getElementById('main-sidebar').classList.add('open')"></i>
                    <h1 id="header-title" style="font-weight: 800; font-size: 1.5rem;">CARICAMENTO...</h1>
                    <div style="width: 24px;"></div>
                </div>

                <div class="search-pill">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Cerca prodotto...">
                </div>

                <div id="folders-menu" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 16px;"></div>
                <div id="main-content"></div>
                
                <button id="floating-paste-btn" class="btn-action solid" style="display:none; position:fixed; bottom:24px; right:24px; width:auto; border-radius:100px; z-index: 1000;" onclick="window.pasteSection()">
                    <i class="fa-solid fa-paste"></i> INCOLLA MATRICE
                </button>
            </main>
        </div>
        
        <div id="nexus-hub" class="spa-view" style="display: none; padding: 24px; overflow-y: auto; height: 100%;">
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px;">
                <button class="btn-action" style="width: auto; padding: 12px 20px;" onclick="window.switchSpaView('app-wrapper');"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 style="font-weight: 800; font-size: 1.5rem; color: var(--nexus);">NEXUS LOGISTICA</h1>
            </div>
            <div id="nexus-content"></div>
        </div>
    </div>

    <div id="modal-layer"></div>

    <script type="module">
        async function runBootloader() {
            try {
                const statusStr = document.getElementById('boot-status');
                statusStr.innerText = "CARICAMENTO MODULI ES6...";
                
                await import('./js/app.js?bypass=' + new Date().getTime());
                
                statusStr.innerText = "SELEZIONA PROFILO E INSERISCI PIN";
                statusStr.style.color = "var(--success)";
            } catch (error) {
                console.error(error);
                alert("CRASH FATALE RILEVATO!\n\nMessaggio: " + error.message);
                document.getElementById('boot-status').innerText = "CRASH LOGICO. LEGGI IL POP-UP.";
                document.getElementById('boot-status').style.color = "var(--danger)";
            }
        }
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        runBootloader();
    </script>
</body>
</html>
